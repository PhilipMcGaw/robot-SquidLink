<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SquidLink simulation architecture</title>
  <desc id="desc">Cockpit connects through NATS to the hardware-in-the-loop bridge, ROS 2 and Gazebo.</desc>
  <defs>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b2d"/><stop offset="1" stop-color="#0c5061"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#water)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g fill="#f7fbfc"><rect x="45" y="125" width="180" height="90" rx="14"/><rect x="265" y="125" width="180" height="90" rx="14"/><rect x="485" y="125" width="180" height="90" rx="14"/><rect x="705" y="125" width="180" height="90" rx="14"/><rect x="925" y="125" width="180" height="90" rx="14"/></g>
    <g fill="#09243a" font-size="22" font-weight="700"><text x="135" y="165">Cockpit</text><text x="355" y="165">NATS</text><text x="575" y="165">HiL bridge</text><text x="795" y="165">ROS 2</text><text x="1015" y="165">Gazebo</text></g>
    <g fill="#4dd0e1" font-size="15"><text x="135" y="190">operator view</text><text x="355" y="190">application contract</text><text x="575" y="190">interface adapter</text><text x="795" y="190">robot middleware</text><text x="1015" y="190">world model</text></g>
  </g>
  <g stroke="#8ee8f2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M225 170h35m185 0h35m185 0h35m185 0h35"/><path d="m248 158 12 12-12 12m220-24 12 12-12 12m220-24 12 12-12 12m220-24 12 12-12 12"/></g>
  <text x="600" y="70" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ROV software-in-the-loop and hardware-in-the-loop</text>
  <text x="600" y="305" fill="#d5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">The simulation exercises the same application-facing interfaces as the real robot.</text>
</svg>